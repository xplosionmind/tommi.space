title: Barrio Bards Banquet
description: |
  The Barrio’s Bards Banquet is a monthly show where we discuss and share practices of clownery to cross-pollinate and burst bubbles.

  This meetup (“banquet”) welcomes bards, jesters, and clowns inhabit niches and are fascinated by weird practices. In particular, we’ll be reflecting on the role of the neighbourhood (“barrio”) in any sort of endeavour.

  In an era of macroscopic and overwhelming challenges, addressing crises in a local context, from below, is a radical act. This gathering aims at fostering intergalactic collaborations amongst jesters who share this goal.
bio: |
  Tommi is a bubbly blunt buoyant bard, born by the Mediterranean sea twenty-six years ago. They are a nerdy pseudo-artist and aspiring activist whose research focuses on hybridating and intersecting practices that appear to be different but that are ultimately aligned and complementary.

  They are currently studying at the second year of XPUB master degree and working at the Internet Archive Europe. They are also involved in other projects, organisations and initiatives, where they usually are the geeky jester in the room.

  https://tommi.space is the virtual representation of Tommi’s mind.
